[package]
name = "guardstate"
version = "0.1.0"
edition = "2021"
authors = ["Annanya Sood <annanyas0142@gmail.com>"]
description = "Rust-side atomic-context typestate analyzer for detecting sleep-in-atomic violations at the Rust-to-C FFI boundary (the Rust half of CLSC)."
